<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f6f1f1;
            height: 100vh;
            display : flex;
            justify-content: center;
            /* justify-content: space-between*/
            gap: 22px;
            align-items: center;
            flex-wrap: wrap;
        }
        .product{
            border: 1px solid black;
            border-radius: 12px;
            width: 250px;

            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 4px 4px 8px black;
            text-align: center;
        }
        .product img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
        }
        .product:hover{
            background-color: #dacdcd;
            color: white;

            transition: 2s;
            transform: scale(1.02);
        }
        .product button{
            background-color: antiquewhite;
            padding: 10px;
            border-radius: 12px;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="product">
        <img src="https://images.pexels.com/photos/6931586/pexels-photo-6931586.jpeg">
        <h2>Camera</h2>
        <p>Rs.23,999</p>
        <button>Buy Now</button>
    </div>
    <div class="product">
        <img src="https://images.pexels.com/photos/11945638/pexels-photo-11945638.jpeg">
        <h2>Headphones</h2>
        <p>Rs.3,999</p>
        <button>Buy Now</button>
    </div>
    <div class="product">
        <img src="https://images.pexels.com/photos/569062/pexels-photo-569062.png">
        <h2>Mobile Phone</h2>
        <p>Rs.26,000</p>
        <button>Buy Now</button>
    </div>
    <div class="product">
        <img src="https://images.pexels.com/photos/14541009/pexels-photo-14541009.jpeg">
        <h2>Gimble</h2>
        <p>Rs.8,999</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
