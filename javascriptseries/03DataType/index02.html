<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Multiple Data

        //1.Array helps us to store multiple data at the same time- Different Data Types
        //Symbol : [] Square Bracket
        //Rule : Indexno(position no) Starts ZERO - 0
        
        let students = ["ayush","supriya","siya","madhura","manthan",123,565,true]

        //Total No of data in array = .length
        console.log(students.length)
        //ArrayName[IndexNo]
        console.log(students[4])

        console.log(students[7])

        console.log(students[9])

        //Collection of Data - object symbol - {key:value pair  }

        let employee={
            //key(left):value(right)
            name:"om",
            dept:"IT",
            EmId:"EM001",
            salary:6000,
            loginStatus:false,
        }

        //pbjectname.keyname
        console.log(employee.salary)
        console.log(employee.name)

        //Real life Example - Store the Data of Cafe MEnu

        let cafeMenu = [

            {name:"coffee", price:100},
            {name:"tea" ,price:80},
            {name :"sandwich", price :150}

        ]

        console.log(cafeMenu[2].name , cafeMenu[2].price)
    </script>
</body>
</html>
