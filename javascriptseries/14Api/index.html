<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //fetch('Api Address') : To Get The Data from API
        //RULE : Convert THE API Response into JSON(java script Object notation) Format  .json()

        fetch('https:randomuser.me/api')

        //1.successful
        .then( response => response.json())

        .then(data => console.log(data.results))

        //2.unsuccessfull - Error
        .catch(function(error){
            console.log('Error Connection' , error)
        })


    </script>
</body>
</html>
