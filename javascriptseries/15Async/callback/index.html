<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CALLBACK : Call BAck is Function AND it is passed as parameter -(callback) Into Another Function

        function DoHomeWork(subject , callback){
            console.log('Doing home work for ${subject}')

            callback() //CAlling the callback function
        }
        DoHomeWork("Maths" , function(){
            console.log("homework Done Going To Play")
        })
    </script>
</body>
</html>
