<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #abc:hover{
            background-color: violet;
            color: beige;
            text-align: center;
        }
        div{
            background-color: red;
            width: 100px;
            height: 100px;
        }
        div:hover{
            background-color: blue;
            color: white;
            text-align: center;
            transition: 3s;
        }
        button:hover{
            background-color: green;
            transition: 5s;
        }
        
    </style>
</head>
<body>
    <div id="abc">
        BOX
    </div>
    <div>
        BOX
    </div>
    <button>Click Me</button>
</body>
</html>
