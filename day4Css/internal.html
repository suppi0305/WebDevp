<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color: brown;
            text-align: center;

        }
        p{
            background-color: cadetblue;
        }

    </style>
</head>
<body>
    <!--Internal - Inside the html using style as tag under head section-->

    <h2 style="color: blue;">Good Evening</h2>    <!--Inline-->
    <p>This is a Paragraph Tag</p>
</body>
</html>
